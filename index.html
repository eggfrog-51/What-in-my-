<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>灶頭誌 · 我家冰箱帳本</title>

<!-- 加到手機主畫面用：PWA manifest + 圖示 -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#6B4226" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="灶頭誌" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap');

  :root{
    --ink:#2B2621; --paper:#FAF6ED; --paper2:#F1EADA; --soy:#6B4226;
    --jade:#4C7A5E; --jade-deep:#365C45; --turmeric:#D8A23B; --chili:#B23A2E; --line:#DAD0BA;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans TC',sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .ledger-header{font-family:'Noto Serif TC',serif;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 64px;}
  header{border-bottom:1px solid var(--line);padding:24px 16px 16px;}
  .brand{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto;}
  .brand-icon{width:44px;height:44px;border-radius:50%;background:var(--soy);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .brand h1{font-size:24px;font-weight:700;color:var(--soy);margin:0;}
  .brand p{font-size:12px;opacity:.7;margin:2px 0 0;}
  nav{display:flex;gap:4px;padding:16px 16px 0;overflow-x:auto;max-width:640px;margin:0 auto;}
  .tab-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px 8px 0 0;font-size:14px;font-weight:500;
    background:transparent;border:none;border-bottom:2px solid transparent;opacity:.6;cursor:pointer;white-space:nowrap;color:var(--ink);font-family:inherit;}
  .tab-btn.active{background:var(--paper2);color:var(--soy);border-bottom:2px solid var(--soy);opacity:1;}
  main{padding-top:12px;}
  .section{margin-bottom:24px;}
  .section h2{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--soy);margin:0 0 8px;}
  .muted{font-size:12px;opacity:.6;margin:0 0 10px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;}
  .box{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .row{display:flex;gap:8px;align-items:center;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 10px;font-size:14px;font-family:inherit;outline:none;color:var(--ink);
  }
  textarea{width:100%;resize:vertical;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn-primary{background:var(--soy);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn-jade{background:var(--jade);color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500;}
  .btn-ghost{background:#fff;border:1px solid var(--soy);color:var(--soy);border-radius:999px;padding:6px 12px;font-size:12px;}
  .btn-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chip{border-radius:999px;padding:6px 12px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;}
  .chip.on{background:var(--soy);color:#fff;border-color:var(--soy);}
  .chip.jade-on{background:var(--jade);color:#fff;border-color:var(--jade);}
  .flex-wrap{display:flex;flex-wrap:wrap;gap:8px;}
  .item-row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .item-row .name{flex:1;min-width:0;}
  .item-row .name p{margin:0;font-size:14px;font-weight:500;}
  .item-row .name small{font-size:11px;opacity:.6;}
  .qty-btn{width:24px;height:24px;border-radius:50%;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:14px;}
  a{color:inherit;text-decoration:none;}
  a.link{color:var(--soy);font-size:12px;display:inline-flex;align-items:center;gap:4px;}
  .banner{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;}
  .banner.warn{background:#FBF0E4;border:1px solid var(--turmeric);}
  .banner.err{background:#FBEAE7;color:var(--chili);}
  .today-card{background:var(--soy);color:var(--paper);border-radius:14px;padding:16px;margin-bottom:20px;}
  .today-card h3{font-family:'Noto Serif TC',serif;font-size:20px;margin:0;}
  details summary{cursor:pointer;font-size:12px;}
  ol{margin:6px 0 0;padding-left:18px;font-size:12px;opacity:.85;}
  ::placeholder{color:#9c9284;}
  @media (max-width:420px){ .brand h1{font-size:20px;} }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">🍳</div>
    <div>
      <h1>灶頭誌</h1>
      <p>我家冰箱帳本 · 今晚煮什麼</p>
    </div>

</header>

<nav id="nav"></nav>

<div class="wrap">
  <main id="main"></main>
</div>

<script>
/* ============ 資料 ============ */
const CATS = [
  { key:"蔬菜", label:"蔬菜", icon:"🥬", color:"var(--jade)" },
  { key:"肉類", label:"肉類", icon:"🥩", color:"var(--soy)" },
  { key:"海鮮", label:"海鮮", icon:"🦐", color:"#3E6E8E" },
  { key:"蛋豆製品", label:"蛋豆製品", icon:"🥚", color:"var(--turmeric)" },
  { key:"其他", label:"其他", icon:"📦", color:"#7A7266" },
];

const DEFAULT_SEASONINGS = ["鹽","醬油","糖","米酒","香油(麻油)","白胡椒粉","蒜頭","薑","蔥","辣椒","醋","豆瓣醬","咖哩粉","番茄醬","沙茶醬","五香粉","雞粉/味精"];

const DEFAULT_STAPLES = ["高麗菜","空心菜","蔥","薑","蒜頭","雞肉","豬肉","雞蛋","豆腐","食用油","洋蔥","米","醬油"];

const RECIPES = [
  { id:"r1", name:"蒜炒高麗菜", tag:"熱炒", main:[{n:"高麗菜"}], season:["蒜頭","鹽","香油(麻油)"], steps:["高麗菜切片、蒜頭切末","熱油爆香蒜末","下高麗菜大火快炒，加鹽、香油調味起鍋"] },
  { id:"r2", name:"番茄炒蛋", tag:"熱炒", main:[{n:"番茄"},{n:"蛋"}], season:["鹽","糖","米酒"], steps:["蛋液炒至半熟盛起","番茄炒軟出汁","回鍋加蛋、鹽、糖、米酒拌勻"] },
  { id:"r3", name:"蔥爆豬肉", tag:"熱炒", main:[{n:"豬肉"},{n:"蔥"}], season:["醬油","米酒","糖","蒜頭"], steps:["豬肉片醃醬油、米酒","大火煸香蒜末","下肉片炒熟，最後加蔥段快速拌炒"] },
  { id:"r4", name:"客家小炒", tag:"熱炒", main:[{n:"豬肉"},{n:"豆干"},{n:"蔥"}], season:["醬油","米酒","辣椒"], steps:["豆干、肉絲分別炒香","全部食材下鍋拌炒","加醬油、米酒、辣椒調味"] },
  { id:"r5", name:"麻婆豆腐", tag:"熱炒", main:[{n:"豆腐"},{n:"絞肉"}], season:["豆瓣醬","醬油","蒜頭","五香粉"], steps:["絞肉炒散炒香","加豆瓣醬炒出紅油","下豆腐塊燉煮入味"] },
  { id:"r6", name:"蒜炒地瓜葉", tag:"熱炒", main:[{n:"地瓜葉"}], season:["蒜頭","鹽"], steps:["蒜頭爆香","地瓜葉下鍋大火快炒","加鹽調味即可起鍋"] },
  { id:"r7", name:"三杯雞", tag:"熱炒", main:[{n:"雞肉"}], season:["香油(麻油)","醬油","米酒","糖","蒜頭","薑"], steps:["麻油爆香薑片、蒜頭","雞肉煎至表面金黃","加醬油、米酒、糖燒至收汁"] },
  { id:"r8", name:"番茄蛋花湯", tag:"湯品", main:[{n:"番茄"},{n:"蛋"}], season:["鹽","香油(麻油)"], steps:["番茄切塊煮軟出味","加水煮滾","淋蛋液成蛋花，加鹽、香油調味"] },
  { id:"r9", name:"紫菜蛋花湯", tag:"湯品", main:[{n:"紫菜"},{n:"蛋"}], season:["鹽","香油(麻油)","白胡椒粉"], steps:["水煮滾放入紫菜","淋蛋液攪成蛋花","加鹽、白胡椒粉、香油調味"] },
  { id:"r10", name:"蒜香四季豆", tag:"熱炒", main:[{n:"四季豆"}], season:["蒜頭","醬油","糖"], steps:["四季豆切段汆燙","蒜末爆香","下四季豆拌炒，加醬油、糖調味"] },
  { id:"r11", name:"韭菜炒蛋", tag:"熱炒", main:[{n:"韭菜"},{n:"蛋"}], season:["鹽"], steps:["蛋液炒至半凝固盛起","韭菜段炒軟","回鍋加蛋拌勻，加鹽調味"] },
  { id:"r12", name:"涼拌小黃瓜", tag:"涼拌", main:[{n:"小黃瓜"}], season:["蒜頭","醋","糖","鹽","香油(麻油)"], steps:["小黃瓜拍碎切段、殺青瀝乾","調醬：蒜末、醋、糖、鹽、香油","拌勻冰鎮後即可"] },
  { id:"r13", name:"麻油雞", tag:"湯品", main:[{n:"雞肉"}], season:["香油(麻油)","米酒","薑"], steps:["黑麻油小火煸薑片至捲曲","下雞肉煎炒至變色","加米酒(可加水)燉煮入味"] },
  { id:"r14", name:"醬燒豆腐", tag:"熱炒", main:[{n:"豆腐"}], season:["醬油","糖","蒜頭"], steps:["豆腐煎至兩面金黃","蒜末爆香","加醬油、糖、少許水燒至收汁"] },
  { id:"r15", name:"咖哩雞肉馬鈴薯", tag:"主食", main:[{n:"雞肉"},{n:"馬鈴薯"},{n:"洋蔥"}], season:["咖哩粉","鹽"], steps:["洋蔥炒軟，雞肉煎至變色","加馬鈴薯與水燉煮至軟","拌入咖哩粉煮濃稠"] },
  { id:"r16", name:"蒜蓉炒空心菜", tag:"熱炒", main:[{n:"空心菜"}], season:["蒜頭","醬油"], steps:["蒜末大火爆香","空心菜下鍋快炒","加醬油炒勻即可起鍋"] },
  { id:"r17", name:"胡椒蝦", tag:"熱炒", main:[{n:"蝦"}], season:["鹽","白胡椒粉","米酒","蒜頭"], steps:["蝦洗淨剪去鬚腳","蒜末爆香，蝦下鍋煎香","加米酒、鹽、大量白胡椒粉拌炒"] },
  { id:"r18", name:"絲瓜炒蛋", tag:"熱炒", main:[{n:"絲瓜"},{n:"蛋"}], season:["鹽","薑"], steps:["薑絲爆香，絲瓜下鍋炒軟出水","蛋液炒至半熟盛起","回鍋與絲瓜拌勻，加鹽調味"] },
];

const SEASONAL_VEG = {
  1:["高麗菜","白蘿蔔","花椰菜","茼蒿","芥菜"], 2:["高麗菜","白蘿蔔","花椰菜","茼蒿","豌豆"],
  3:["竹筍","芹菜","萵苣","花椰菜","豌豆"], 4:["竹筍","絲瓜","空心菜","萵苣","苦瓜"],
  5:["絲瓜","空心菜","苦瓜","龍鬚菜","玉米"], 6:["絲瓜","空心菜","龍鬚菜","玉米","秋葵"],
  7:["空心菜","秋葵","絲瓜","龍鬚菜","冬瓜"], 8:["空心菜","秋葵","冬瓜","地瓜葉","茄子"],
  9:["地瓜葉","茄子","秋葵","南瓜","絲瓜"], 10:["南瓜","茭白筍","地瓜葉","花椰菜","芥藍"],
  11:["高麗菜","花椰菜","芥藍","茭白筍","白蘿蔔"], 12:["高麗菜","白蘿蔔","花椰菜","茼蒿","芥菜"],
};

const STYLE_TEMPLATES = [
  { label:"清炒", make:i=>`清炒${i}` }, { label:"蒜炒", make:i=>`蒜炒${i}` }, { label:"涼拌", make:i=>`涼拌${i}` },
  { label:"咖哩", make:i=>`咖哩${i}` }, { label:"焗烤", make:i=>`焗烤${i}` }, { label:"湯", make:i=>`${i}湯` },
  { label:"烘蛋", make:i=>`${i}烘蛋` }, { label:"沙拉", make:i=>`${i}沙拉` },
];

const STORAGE_KEY = "zaotouzhi-data";
const uid = () => Math.random().toString(36).slice(2,10);
const norm = s => (s||"").trim().toLowerCase();
const todayStr = () => new Date().toISOString().slice(0,10);
const daysUntil = d => { if(!d) return null; const a=new Date(d+"T00:00:00"), b=new Date(todayStr()+"T00:00:00"); return Math.round((a-b)/86400000); };
const icookUrl = k => `https://icook.tw/search/${encodeURIComponent(k.trim())}/`;
const catInfo = key => CATS.find(c=>c.key===key) || CATS[4];
const guessCategory = n => {
  if(/雞|豬|牛|羊|鴨|絞肉|培根|香腸|火腿|排骨/.test(n)) return "肉類";
  if(/蝦|魚|蟹|蛤|花枝|透抽|鮮蚵|干貝|海鮮|魷魚/.test(n)) return "海鮮";
  if(/蛋|豆腐|豆干|豆皮|豆漿/.test(n)) return "蛋豆製品";
  if(/菜|瓜|筍|椒|蔥|菇|薯|芋|番茄|茄子|蘿蔔|洋蔥|花椰/.test(n)) return "蔬菜";
  return null;
};

/* ============ 狀態 + 儲存(瀏覽器 localStorage，跟 Claude 的雲端無關，關掉分頁/重開機都還在) ============ */
let state = {
  tab:"fridge",
  fridgeItems: [],
  seasonings: DEFAULT_SEASONINGS.map(n=>({name:n, have:false})),
  shoppingList: [],
  staples: [...DEFAULT_STAPLES],
  categoryTouched:false,
  starIngredient:null,
  selectedCombo:[],
  pickSeed:Math.random(),
  aiApiKey:"",
  aiLoading:false,
  aiError:"",
  aiRecipes:null,
};

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      state.fridgeItems = p.fridgeItems || [];
      state.seasonings = (p.seasonings && p.seasonings.length) ? p.seasonings : state.seasonings;
      state.shoppingList = p.shoppingList || [];
      state.staples = (p.staples && p.staples.length) ? p.staples : [...DEFAULT_STAPLES];
      state.aiApiKey = p.aiApiKey || "";
    }
  }catch(e){ console.warn("讀取本機資料失敗", e); }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      fridgeItems: state.fridgeItems, seasonings: state.seasonings,
      shoppingList: state.shoppingList, staples: state.staples, aiApiKey: state.aiApiKey,
    }));
  }catch(e){ console.warn("儲存失敗(可能是瀏覽器隱私模式或空間不足)", e); }
}

/* ============ 動作 ============ */
function isStaple(name){
  return state.staples.some(s => norm(s)===norm(name) || norm(name).includes(norm(s)) || norm(s).includes(norm(name)));
}
function addToShoppingIfStaple(name){
  if(!isStaple(name)) return;
  if(state.shoppingList.some(s=>norm(s.name)===norm(name))) return;
  state.shoppingList.push({id:uid(), name});
}
function addItem(item){
  state.fridgeItems.push({id:uid(), ...item});
  state.shoppingList = state.shoppingList.filter(s=>norm(s.name)!==norm(item.name));
  save(); render();
}
function removeItem(id){
  const removed = state.fridgeItems.find(i=>i.id===id);
  state.fridgeItems = state.fridgeItems.filter(i=>i.id!==id);
  if(removed) addToShoppingIfStaple(removed.name);
  save(); render();
}
function changeQty(id, delta){
  let ranOut = null;
  state.fridgeItems = state.fridgeItems.map(i=>{
    if(i.id!==id) return i;
    return {...i, quantity: Math.max(0, +(i.quantity+delta).toFixed(1))};
  }).filter(i=>{ if(i.quantity>0) return true; ranOut=i.name; return false; });
  if(ranOut) addToShoppingIfStaple(ranOut);
  save(); render();
}
function toggleSeasoning(name){
  state.seasonings = state.seasonings.map(s=> s.name===name ? {...s, have:!s.have} : s);
  save(); render();
}
function addCustomSeasoning(name){
  if(!name || !name.trim()) return;
  if(state.seasonings.some(s=>norm(s.name)===norm(name))) return;
  state.seasonings.push({name:name.trim(), have:true});
  save(); render();
}
function removeSeasoning(name){ state.seasonings = state.seasonings.filter(s=>s.name!==name); save(); render(); }

function removeFromShopping(id){ state.shoppingList = state.shoppingList.filter(s=>s.id!==id); save(); render(); }
function addCustomShopping(name){
  if(!name || !name.trim()) return;
  if(state.shoppingList.some(s=>norm(s.name)===norm(name))) return;
  state.shoppingList.push({id:uid(), name:name.trim()});
  save(); render();
}
function buyShoppingItem(item){
  state.shoppingList = state.shoppingList.filter(s=>s.id!==item.id);
  state.fridgeItems.push({id:uid(), name:item.name, category:guessCategory(item.name)||"其他", quantity:1, unit:"份", expiry:""});
  save(); render();
}
function toggleStaple(name){
  state.staples = state.staples.includes(name) ? state.staples.filter(n=>n!==name) : [...state.staples, name];
  save(); render();
}
function addCustomStaple(name){
  if(!name || !name.trim()) return;
  if(state.staples.some(n=>norm(n)===norm(name))) return;
  state.staples.push(name.trim()); save(); render();
}
function removeStaple(name){ state.staples = state.staples.filter(n=>n!==name); save(); render(); }

function addSeasonalVeg(name){
  addItem({name, category:"蔬菜", quantity:1, unit:"份", expiry:""});
}

function toggleComboItem(name){
  state.selectedCombo = state.selectedCombo.includes(name)
    ? state.selectedCombo.filter(n=>n!==name) : [...state.selectedCombo, name];
  render();
}
function setStarIngredient(name){ state.starIngredient = (state.starIngredient===name) ? null : name; render(); }
function rerollPick(){ state.pickSeed = Math.random(); render(); }

function saveApiKey(){
  const v = document.getElementById("ai-key-input").value;
  state.aiApiKey = v.trim();
  save();
  alert("已儲存 API Key 到這台裝置的瀏覽器裡。");
}

async function generateAiMenu(){
  if(!state.aiApiKey){
    state.aiError = "請先在下面貼上你自己的 Anthropic API Key 才能使用 AI 生成";
    render(); return;
  }
  if(!/^sk-ant-/.test(state.aiApiKey)){
    state.aiError = "這個 Key 格式看起來不太對，正確的 API Key 應該是 sk-ant- 開頭一長串，請確認複製完整、沒有多餘空格";
    render(); return;
  }
  state.aiLoading = true; state.aiError = ""; render();
  const fridgeList = state.fridgeItems.filter(i=>i.quantity>0).map(i=>`${i.name}(${i.quantity}${i.unit})`).join("、") || "無";
  const seasoningList = state.seasonings.filter(s=>s.have).map(s=>s.name).join("、") || "無";
  const prompt = `你是台灣家常料理顧問。這是我家冰箱現有食材：${fridgeList}。這是我家裡有的調味料：${seasoningList}。
請設計 5 道台灣/中式家常菜建議，優先推薦用現有食材跟調味料就能直接煮的菜，其餘可以缺 1-2 樣食材或調味料。
只能輸出「JSON 陣列」，不要任何說明文字、不要 markdown code fence。每個物件格式：
{"name":"菜名","canMakeNow":true或false,"missing":["缺的食材或調味料，沒有缺就是空陣列"],"steps":["步驟1","步驟2","步驟3"],"note":"一句話說明為什麼推薦這道(15字內)"}`;

  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "content-type":"application/json",
        "x-api-key": state.aiApiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true",
      },
      body: JSON.stringify({ model:"claude-sonnet-5", max_tokens:1000, messages:[{role:"user", content:prompt}] }),
    });
    const data = await resp.json();
    if(!resp.ok){
      const raw = (data && data.error && data.error.message) || `API 錯誤 (${resp.status})`;
      if(resp.status === 401 || /api.?key/i.test(raw)){
        throw new Error("API Key 無效。請確認：1) 是在 console.anthropic.com 申請的完整 Key，不是 claude.ai 的登入帳號 2) 複製時沒有漏字或多空格 3) 這個 Key 沒有被刪除或過期");
      }
      if(resp.status === 400 && /credit|billing/i.test(raw)){
        throw new Error("帳戶額度不足，請到 console.anthropic.com 確認已設定付款方式並有可用額度");
      }
      throw new Error(raw);
    }
    const text = (data.content||[]).map(b=>b.text||"").join("").trim();
    let clean = text.replace(/```json|```/g,"").trim();
    const s = clean.indexOf("["), e = clean.lastIndexOf("]");
    if(s!==-1 && e!==-1 && e>s) clean = clean.slice(s, e+1);
    const parsed = JSON.parse(clean);
    if(!Array.isArray(parsed) || !parsed.length) throw new Error("回應格式不正確");
    state.aiRecipes = parsed;
  }catch(err){
    state.aiError = "生成失敗：" + (err.message || "請再試一次");
  }finally{
    state.aiLoading = false; render();
  }
}

/* ============ 食譜配對 ============ */
function matchRecipes(){
  return RECIPES.map(r=>{
    const haveMain = r.main.filter(m => state.fridgeItems.some(i=> i.quantity>0 && (norm(i.name).includes(norm(m.n)) || norm(m.n).includes(norm(i.name)))));
    const haveSeason = r.season.filter(s => state.seasonings.some(x=>x.name===s && x.have));
    const total = r.main.length + r.season.length;
    const got = haveMain.length + haveSeason.length;
    const pct = Math.round((got/total)*100);
    const missingMain = r.main.filter(m=>!haveMain.includes(m));
    const missingSeason = r.season.filter(s=>!haveSeason.includes(s));
    return {...r, pct, missingMain, missingSeason, allMainReady: missingMain.length===0};
  }).sort((a,b)=>b.pct-a.pct);
}

        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }
  if(!uniqueIngredients.length) html += `<p class="muted">冰箱裡還沒有食材，先到「冰箱庫存」登記幾樣吧。</p>`;

      <div class="flex-wrap" style="margin-bottom:8px;">`;

      const on = state.selectedCombo.includes(name);
      html += `<button class="chip ${on?'on':''}" onclick="toggleComboItem('${name.replace(/'/g,"\\'")}')">${name}</button>`;
    });
    html += `</div><div class="row">`;
    if(state.selectedCombo.length){
      html += `<a class="btn-primary" href="${icookUrl(state.selectedCombo.join(' '))}" target="_blank" rel="noopener noreferrer">🔍 搜尋這個組合「${state.selectedCombo.join(' ')}」</a>

    <input type="text" id="rc-keyword" placeholder="或輸入其他關鍵字，例如：氣炸鍋、電鍋料理" style="flex:1;" onkeydown="if(event.key==='Enter' && this.value.trim()){window.open(icookUrl(this.value),'_blank');}">

  </div></div>`;

  return html;

  }
  html += `<div class="row" style="margin-top:10px;">
    <input type="text" id="sh-new" placeholder="手動加入採購清單，例如：衛生紙" style="flex:1;" onkeydown="if(event.key==='Enter'){addCustomShopping(this.value);this.value='';}">
    <button class="btn-primary btn-circle" onclick="const el=document.getElementById('sh-new');addCustomShopping(el.value);el.value='';">＋</button>
  </div></div>`;

  html += `<div class="section"><h2>${month} 月當季蔬菜推薦</h2><p class="muted">參考台灣時令蔬菜產季，蔬菜存量低時可以優先選購。</p>`;
  seasonalList.forEach(name=>{
    html += `<div class="item-row"><span>🥬</span><div class="name"><p>${name}</p></div>
      <button class="btn-jade" onclick="addSeasonalVeg('${name}');this.disabled=true;this.textContent='✓ 已加入冰箱';">＋ 加入冰箱</button></div>`;
  });
  html += `</div>`;

  html += `<div class="section"><h2>常備清單</h2>
    <p class="muted">這些是你家常用、容易忘記買的東西。勾起來的品項，一旦在冰箱用完就會自動進「採購清單」。</p>
    <div class="flex-wrap" style="margin-bottom:10px;">`;
  state.staples.forEach(name=>{
    html += `<button class="chip jade-on" onclick="toggleStaple('${name.replace(/'/g,"\\'")}')">${name} <span onclick="event.stopPropagation();removeStaple('${name.replace(/'/g,"\\'")}')">✕</span></button>`;
  });
  html += `</div>
    <div class="row">
      <input type="text" id="st-new" placeholder="新增常備品，例如：吐司" style="flex:1;" onkeydown="if(event.key==='Enter'){addCustomStaple(this.value);this.value='';}">
      <button class="btn-primary btn-circle" onclick="const el=document.getElementById('st-new');addCustomStaple(el.value);el.value='';">＋</button>
    </div>
  </div>`;

  return html;
}

/* ============ 啟動 ============ */
load();
render();
</script>
</body>
</html>
